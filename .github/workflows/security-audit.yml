name: Security Audit

# ---------------------------------------------------------------------------
# Deliberately on a schedule rather than on every pull request.
#
# A new CVE is published against a dependency you did not touch, so pinning
# this to PRs would block unrelated work on somebody else's disclosure while
# burning minutes on every push. Weekly is the right cadence: it still surfaces
# a vulnerability within days, and because it never runs as a PR check, it is
# free to fail hard when it finds one.
#
# This service handles patient-entered symptom data. A known-vulnerable
# transitive dependency is a real finding here, not paperwork.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Mondays, 03:00 UTC (10:00 Vietnam time) -- a finding is waiting at the
    # start of the week rather than arriving mid-sprint.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies
    # GitHub-hosted by default. Hard-coding [self-hosted, linux, x64] left every
    # job in the public copy of this repository queued with runner_id 0 until
    # GitHub cancelled it: no machine there carries those labels. A copy that has
    # to run on its own machines (the org repository, whose GitHub-hosted jobs are
    # blocked by billing) sets the repository variable CI_RUNS_ON to
    # ["self-hosted","linux","x64"] instead of editing this file.
    runs-on: ${{ vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the full dependency set
        # The *full* set, torch included -- unlike CI, which excludes the ML
        # stack for speed. This job has to audit what production actually
        # installs from the Dockerfile, not the trimmed set the tests need.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit installed packages
        # Audit the installed set through its frozen list rather than the live
        # environment. torch comes from the PyTorch CPU index as 2.13.0+cpu, a
        # local version PyPI does not know, so --strict stopped every run on
        # "Dependency not found on PyPI" before any advisory was looked up. The
        # +cpu label only names the build; the public version carries the same
        # advisories, so it is audited under that name and --strict still
        # covers every other package.
        run: |
          pip freeze --all | sed -E 's/\+cpu$//' > audit-requirements.txt
          pip-audit -r audit-requirements.txt --no-deps --disable-pip --strict --desc

  node:
    name: Frontend dependencies
    # Same runner rule as the first job in this file.
    runs-on: ${{ vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        # high and critical only. Auditing at `low` on a Next.js tree produces
        # a permanent wall of transitive noise, and a signal nobody reads is
        # the same as no signal.
        run: npm audit --audit-level=high
